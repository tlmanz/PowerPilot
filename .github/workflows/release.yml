name: Release

# Push a tag like v1.0.0 to build macOS, Linux and Windows archives and
# publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Vet the Linux and Windows builds
        run: |
          GOOS=linux CGO_ENABLED=0 go vet ./...
          GOOS=windows CGO_ENABLED=0 go vet ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { target: darwin, runner: macos-latest }
          - { target: linux, runner: ubuntu-latest }
          - { target: windows, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-release.sh ${{ matrix.target }} ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "PowerPilot ${{ github.ref_name }}" \
            --notes-file packaging/release-notes.md \
            --verify-tag

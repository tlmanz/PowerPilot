<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerPilot</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="tray.css">
<script type="module" src="js/tray.js"></script>
</head>
<body>
<svg class="visually-hidden" width="0" height="0" aria-hidden="true">
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></symbol>
  <symbol id="i-plug-off" viewBox="0 0 24 24"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M5.5 10v4M9 10v4M12.5 10v4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
  <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M13.7 21a2 2 0 0 1-3.4 0M18.6 13A17.9 17.9 0 0 1 18 8M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.3-5M2 2l20 20"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-outlet" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 8v3M15 8v3M9.5 16h5"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
</svg>

<main class="panel" id="panel">
  <header class="head">
    <img class="logo" src="assets/logo.png" alt="">
    <div class="who">
      <b>PowerPilot</b>
      <span id="device">Connecting…</span>
    </div>
    <span class="pill off" id="pill">Offline</span>
  </header>

  <section class="hero">
    <div class="ring off" id="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52"/>
        <circle class="value" id="ring-value" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ring-text">
        <b><span id="pct">—</span><small id="pct-unit" hidden>%</small></b>
        <span>battery</span>
      </div>
    </div>
    <div class="hero-text">
      <div class="headline" id="headline" aria-live="polite">Connecting…</div>
      <div class="sub" id="sub"></div>
      <div class="runtime" id="runtime" hidden><svg class="icon"><use href="#i-clock"/></svg><span id="runtime-text"></span></div>
    </div>
  </section>

  <div class="banner" id="banner" hidden>
    <svg class="icon"><use href="#i-alert"/></svg>
    <span id="banner-text"></span>
    <button class="banner-btn" id="mute" hidden><svg class="icon"><use href="#i-bell-off"/></svg>Mute</button>
  </div>

  <section class="tiles" id="tiles">
    <div class="tile">
      <div class="tile-head"><svg class="icon"><use href="#i-gauge"/></svg>Load</div>
      <b id="load">—</b>
      <small id="load-sub">&nbsp;</small>
      <div class="bar"><i id="load-bar"></i></div>
    </div>
    <div class="tile">
      <div class="tile-head"><svg class="icon"><use id="input-icon" href="#i-plug"/></svg>Input</div>
      <b id="input">—</b>
      <small id="input-sub">&nbsp;</small>
    </div>
    <div class="tile">
      <div class="tile-head"><svg class="icon"><use href="#i-outlet"/></svg>Output</div>
      <b id="output">—</b>
      <small id="output-sub">&nbsp;</small>
    </div>
    <div class="tile">
      <div class="tile-head"><svg class="icon"><use href="#i-battery"/></svg>Battery</div>
      <b id="battv">—</b>
      <small id="battv-sub">&nbsp;</small>
    </div>
  </section>

  <div class="actions">
    <button class="btn" id="summary" title="Show the latest reading as a notification"><svg class="icon"><use href="#i-bell"/></svg>Summary</button>
    <button class="btn primary" id="open"><svg class="icon"><use href="#i-monitor"/></svg>Open Dashboard</button>
  </div>

  <footer class="foot">
    <span id="updated"></span>
    <button class="link" id="quit" title="Remove the menu-bar icon; the service keeps watching the UPS">Quit</button>
  </footer>
</main>
</body>
</html>
